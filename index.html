<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NekoVerse — Temukan Anime Favoritmu</title>
  <style>
    :root {
      --bg: #09090f;
      --surface: #13131d;
      --surface-hover: #1b1b28;
      --text: #f7f7fb;
      --muted: #9b9baa;
      --primary: #ff4d8d;
      --accent: #8b5cf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(139,92,246,.16), transparent 25rem),
        radial-gradient(circle at 85% 20%, rgba(255,77,141,.12), transparent 28rem),
        var(--bg);
    }

    nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1180px;
      margin: auto;
      padding: 0 24px;
    }

    .logo {
      font-weight: 900;
      font-size: 21px;
      letter-spacing: -.5px;
    }

    .logo span { color: var(--primary); }

    .nav-links { display: flex; gap: 28px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }

    .hero {
      min-height: 490px;
      display: flex;
      align-items: center;
      max-width: 1180px;
      margin: 12px auto 32px;
      padding: 48px 24px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(90deg, rgba(9,9,15,.98) 20%, rgba(9,9,15,.62) 60%, rgba(9,9,15,.15)),
        url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1600&q=85") center/cover;
      box-shadow: 0 30px 80px rgba(0,0,0,.28);
    }

    .hero-content { max-width: 540px; position: relative; z-index: 1; }
    .eyebrow { color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; }
    h1 { font-size: clamp(42px, 7vw, 72px); line-height: .96; margin: 14px 0 20px; letter-spacing: -3px; }
    .hero p { color: #c7c7d2; line-height: 1.7; max-width: 500px; }

    .search {
      display: flex;
      gap: 10px;
      margin-top: 28px;
      max-width: 470px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      padding: 7px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 15px;
    }

    .search button, .primary-button {
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .search button { padding: 12px 20px; }

    main { max-width: 1180px; margin: auto; padding: 20px 24px 70px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; margin: 24px 0 18px; }
    h2 { margin: 0; font-size: 27px; }
    .section-head button { color: var(--muted); background: none; border: 0; cursor: pointer; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: .25s ease;
      border: 1px solid rgba(255,255,255,.04);
    }

    .card:hover { transform: translateY(-6px); background: var(--surface-hover); }
    .cover { height: 280px; background-size: cover; background-position: center; position: relative; }
    .score { position: absolute; right: 12px; top: 12px; background: rgba(9,9,15,.82); backdrop-filter: blur(8px); border-radius: 8px; padding: 7px 9px; font-size: 12px; font-weight: 800; }
    .card-body { padding: 15px; }
    .card h3 { margin: 0 0 7px; font-size: 16px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }

    dialog {
      width: min(520px, calc(100% - 32px));
      color: var(--text);
      background: #171721;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 30px 100px rgba(0,0,0,.6);
    }

    dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(5px); }
    dialog h3 { font-size: 28px; margin: 0 0 10px; }
    dialog p { color: var(--muted); line-height: 1.7; }
    dialog button { margin-top: 12px; padding: 12px 18px; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .hero { min-height: 440px; }
      .nav-links { display: none; }
    }

    @media (max-width: 520px) {
      nav { height: 64px; }
      .hero { margin: 0 12px 20px; padding: 32px 22px; min-height: 430px; border-radius: 20px; }
      h1 { letter-spacing: -2px; }
      main { padding-inline: 16px; }
      .grid { gap: 12px; }
      .cover { height: 220px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">NEKO<span>VERSE</span></div>
    <div class="nav-links">
      <a class="active" href="#">Beranda</a>
      <a href="#popular">Popular</a>
      <a href="#">Musim Ini</a>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <div class="eyebrow">Rekomendasi Minggu Ini</div>
      <h1>Masuki Dunia<br>Tanpa Batas.</h1>
      <p>Temukan petualangan, emosi, dan karakter yang tak terlupakan dari dunia anime terbaik.</p>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="Cari judul anime..." aria-label="Cari anime">
        <button type="submit">Cari</button>
      </form>
    </div>
  </header>

  <main id="popular">
    <div class="section-head">
      <h2>Sedang Populer</h2>
      <button id="showAll">Lihat semua →</button>
    </div>
    <section class="grid" id="animeGrid"></section>
  </main>

  <dialog id="detailDialog">
    <h3 id="detailTitle"></h3>
    <p id="detailInfo"></p>
    <button class="primary-button" id="closeDialog">Tutup</button>
  </dialog>

  <script>
    const anime = [
      { title: "Demon Slayer", genre: "Action • Fantasy", score: "9.2", image: "https://images.unsplash.com/photo-1618336753974-aae8e04506aa?auto=format&fit=crop&w=700&q=85", info: "Tanjiro memulai perjalanan berbahaya untuk menyelamatkan adiknya dan menghadapi iblis-iblis yang mengancam umat manusia." },
      { title: "Attack on Titan", genre: "Drama • Action", score: "9.1", image: "https://images.unsplash.com/photo-1601850494422-3cf14624b0b3?auto=format&fit=crop&w=700&q=85", info: "Di balik tembok raksasa, umat manusia berjuang mempertahankan hidup dari ancaman makhluk mengerikan." },
      { title: "Jujutsu Kaisen", genre: "Supernatural", score: "8.9", image: "https://images.unsplash.com/photo-1578632292335-df3abbb0d586?auto=format&fit=crop&w=700&q=85", info: "Yuji Itadori terikat pada kutukan kuat dan mempelajari seni jujutsu bersama siswa berbakat lainnya." },
      { title: "Chainsaw Man", genre: "Action • Horror", score: "8.7", image: "https://images.unsplash.com/photo-1614583225154-5fcdda07019e?auto=format&fit=crop&w=700&q=85", info: "Denji memiliki impian sederhana: hidup normal. Namun kesepakatan gelap mengubahnya menjadi Chainsaw Man." }
    ];

    const grid = document.getElementById("animeGrid");
    const dialog = document.getElementById("detailDialog");

    function render(items) {
      grid.innerHTML = items.map((item, index) => `
        <article class="card" data-index="${index}" tabindex="0">
          <div class="cover" style="background-image:url('${item.image}')">
            <span class="score">★ ${item.score}</span>
          </div>
          <div class="card-body">
            <h3>${item.title}</h3>
            <p>${item.genre}</p>
          </div>
        </article>
      `).join("");

      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => openDetail(anime[Number(card.dataset.index)]));
        card.addEventListener("keydown", event => {
          if (event.key === "Enter") openDetail(anime[Number(card.dataset.index)]);
        });
      });
    }

    function openDetail(item) {
      document.getElementById("detailTitle").textContent = item.title;
      document.getElementById("detailInfo").textContent = `${item.genre} • Rating ${item.score}\n\n${item.info}`;
      dialog.showModal();
    }

    document.getElementById("closeDialog").addEventListener("click", () => dialog.close());

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventEvent;
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      render(query ? anime.filter(item => item.title.toLowerCase().includes(query) || item.genre.toLowerCase().includes(query)) : anime);
    });

    render(anime);
  </script>
</body>
</html>
